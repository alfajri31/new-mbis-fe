<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistem Manajemen Bisnis - PT Askrindo (Persero)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="M-BIS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>M-BIS</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload the splash logo so it paints instantly, before any JS runs.
       fetchpriority=high: it's the LCP element, so jump the queue. -->
  <link rel="preload" as="image" href="logo-mbis.webp" fetchpriority="high">

  <!--
    Splash screen shown while the Flutter web bundle (main.dart.wasm + skwasm
    renderer) downloads and boots. Flutter dispatches 'flutter-first-frame' once
    the first frame renders; the inline script below fades this out then.
  -->
  <style>
    /* This must stay pixel-identical to the in-app SplashScreen
       (lib/presentation/screens/splash_screen.dart): same navy, same logo box,
       same wordmark/subtitle/credit positions. When Flutter paints its first
       frame the in-app splash sits underneath, and this layer cross-fades into
       it — matching layouts make the handoff invisible (looks like one splash).
       Colors mirror AppColors: primaryNavy #0D2C54, secondaryOrange #F2843A. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0D2C54;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity .35s ease;
    }
    #splash.splash--hide { opacity: 0; }
    #splash .splash-logo {
      width: 88px;
      height: 88px;
      padding: 12px;
      box-sizing: border-box;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(13, 44, 84, .2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #splash .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #splash .splash-name {
      margin-top: 24px;
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -1px;
      line-height: 1;
    }
    #splash .splash-subtitle {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, .65);
      letter-spacing: 1.5px;
      text-align: center;
    }
    /* Indeterminate while the real download progress is unknown; the in-app
       splash takes over with its determinate fill once Flutter boots. */
    #splash .splash-bar {
      margin-top: 48px;
      width: 160px;
      height: 3px;
      border-radius: 1.5px;
      background: rgba(255, 255, 255, .20);
      overflow: hidden;
    }
    #splash .splash-bar::before {
      content: "";
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 1.5px;
      background: #F2843A;
      animation: splash-bar-slide 1.2s ease-in-out infinite;
    }
    #splash .splash-credit {
      position: fixed;
      bottom: 48px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, .50);
      letter-spacing: .5px;
    }
    @keyframes splash-bar-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .splash-bar::before { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-logo"><img src="logo-mbis.webp" alt="MBIS"></div>
    <div class="splash-name">M-BIS</div>
    <div class="splash-subtitle">SISTEM MANAJEMEN BISNIS</div>
    <div class="splash-bar"></div>
    <div class="splash-credit">PT Askrindo (Persero)</div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Remove the splash once Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('splash--hide');
      splash.addEventListener('transitionend', function () { splash.remove(); });
      // Fallback in case the transitionend never fires.
      setTimeout(function () { splash.remove(); }, 600);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
