# nginx config for the MBIS Flutter web app.
#
# NOTE: this file is an envsubst TEMPLATE, not a finished config. The Dockerfile installs it
# as /etc/nginx/templates/default.conf.template and the stock nginx entrypoint renders it to
# /etc/nginx/conf.d/default.conf at container start. Only ${MBIS_*} placeholders are
# substituted (NGINX_ENVSUBST_FILTER=^MBIS_ in the Dockerfile) — every $host, $uri, $backend
# below is nginx's own variable and is left alone. Adding a new placeholder therefore means
# naming it MBIS_something, or envsubst will silently ignore it.
#
# Two jobs:
#   1. Serve the static Flutter bundle as a single-page app.
#   2. Reverse-proxy /api/* to the backend over the internal Docker network, so
#      the browser only ever talks to ONE origin -> no CORS, and no rebuild when
#      the public domain changes.
#
# Job 2 berlaku untuk NON-PROD. Sejak 2026-08-28 itu berarti server internal dev saja:
# web http://10.100.20.53:3014 dengan backend http://10.100.20.53:3013. Domain staging
# lama `mbis.askrindo.net` SUDAH TIDAK BERLAKU — jangan dipakai lagi sebagai acuan.
#
# Catatan penting soal dev: backend di sana BUKAN service Swarm sepanggung, melainkan
# container compose (`magang-mbis-backend-1`, dengarkan 8080 di dalam) di bridge network
# yang tak bisa dimasuki task Swarm. Karena itu targetnya port terbit di host, bukan nama
# service — lihat MBIS_BACKEND_HOST/PORT di bawah.
#
# PROD memakai topologi berbeda: API publik di https://mbis.askrindo.co.id/v2 sedangkan
# web ini dilayani di IP privat, sehingga build prod diberi
# --build-arg API_URL=https://mbis.askrindo.co.id/v2 dan browser memanggil backend
# LANGSUNG — blok /api/ di bawah tidak ikut jalur itu sama sekali.
#
# Jangan hapus blok /api/ hanya karena prod tidak memakainya: seluruh non-prod bergantung
# padanya. Ia juga jadi jalan mundur kalau nanti diputuskan web prod ikut mem-proxy
# (menghindari CORS) — tinggal kosongkan API_URL dan arahkan proxy_pass ke backend prod.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the backend's spring.servlet.multipart.max-request-size (12MB).
    client_max_body_size 12m;

    # Serve the .gz siblings the Docker build pre-compressed (gzip -9) instead of
    # compressing on the fly. gzip_static hands the ready-made main.dart.wasm.gz /
    # skwasm.wasm.gz straight to the client -> zero per-request CPU on cold loads,
    # which is what made first paint slow (the VPS re-gzipped 3+MB of wasm on every
    # cold visitor). `gzip on` stays as a fallback for anything without a .gz
    # sibling (e.g. proxied /api JSON); its level only matters for those now.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm text/xml application/xml image/svg+xml
               font/ttf font/otf application/font-ttf;

    # --- API reverse proxy -------------------------------------------------
    # Re-resolve the backend name via Docker's embedded DNS so a backend restart
    # (new container IP) doesn't leave nginx pinned to a dead address.
    #
    # Target is set per-environment on the CONTAINER (docker service create --env), because
    # the backend is not reachable the same way everywhere:
    #   staging/coolify : MBIS_BACKEND_HOST=mbis-backend       MBIS_BACKEND_PORT=3023
    #   dev (10.100.20.53) : the backend is a plain compose container (magang-mbis-backend-1)
    #                     on a bridge network a Swarm task cannot join, so we go through the
    #                     host's published port: MBIS_BACKEND_HOST=<host ip> MBIS_BACKEND_PORT=3013
    # Defaults live in the Dockerfile and reproduce the old hard-coded mbis-backend:3023.
    #
    # Use an app-unique name, never the generic "backend": in Coolify this container also sits
    # on the shared "coolify" network where other stacks expose their own "backend" service, so
    # "backend" would resolve to multiple containers and round-robin /api onto the wrong app
    # (flip-flopping 401/403).
    # "^~" wins over the regex static-asset location below even when the path ends in
    # an image extension (e.g. /api/files/visits/foto.jpg) — without it, nginx's regex
    # locations always outrank plain prefix locations, so photo/file requests were
    # matched by the static-asset cache rule (try_files -> 404) and never reached the
    # backend at all, even though non-file /api/* JSON calls worked fine.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend "${MBIS_BACKEND_HOST}";
        proxy_pass http://$backend:${MBIS_BACKEND_PORT};

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Strip the Origin header on this same-origin proxy hop. Browsers send Origin on
        # POST/PUT/DELETE even for same-origin requests; behind this proxy Spring can't
        # tell the request is same-origin, so it validates Origin against its (locked-down,
        # empty) allowed-origins list and rejects login with "Invalid CORS request" (403).
        # Same-origin traffic needs no CORS, so dropping Origin makes Spring treat it as a
        # plain request — while the backend stays locked down for any real cross-origin call.
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File uploads/downloads can be large/slow; give them room.
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- WasmGC (--wasm) loader module -------------------------------------
    # The --wasm build emits main.dart.mjs, an ES module. It does NOT match the
    # .js rule below (".mjs" has no ".js$"), so without this block it would fall
    # through to the SPA fallback and return index.html — and browsers reject a
    # module served as text/html. nginx's mime.types may also not map .mjs, so
    # force the JS type. Hard-cache it like the other hashed build artifacts.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --- Static assets -----------------------------------------------------
    # Hashed Flutter build artifacts are safe to cache hard.
    location ~* \.(?:js|wasm|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|otf|json)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # index.html must never be cached, or clients get stuck on a stale build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- Halaman kebijakan publik ------------------------------------------
    # Kebijakan privasi dan permintaan penghapusan akun disajikan sebagai HTML
    # STATIS, bukan lewat SPA fallback. Ini disengaja dan mudah salah dibongkar,
    # jadi alasannya ditulis lengkap.
    #
    # Keduanya juga rute Flutter (`lib/src/legal/legal_routes.dart`, dikecualikan
    # dari gerbang auth di `lib/src/router.dart`) — dan itu TETAP dipakai untuk
    # navigasi di dalam aplikasi lewat `context.push`. Tapi rute Flutter saja
    # tidak cukup untuk URL yang dilampirkan ke Play Console: aplikasi web ini
    # dibangun sebagai SPA WasmGC, sehingga pengambil HTTP yang tidak menjalankan
    # JS/WASM — pemeriksa otomatis Google Play, dan mesin pencari — hanya menerima
    # cangkang index.html tanpa satu kata pun naskah kebijakan. Halaman yang
    # tampil kosong bagi mereka dianggap sama saja dengan tidak ada kebijakan.
    #
    # Berkasnya turunan, dibangkitkan dari naskah Dart yang sama dengan yang
    # dirender aplikasi (`dart run tool/gen_policy_html.dart` -> `web/*.html`),
    # jadi kedua penyajian mustahil berbeda isi; `policy_html_drift_test.dart`
    # yang menjaganya.
    #
    # `location =` (exact match) menang atas SEMUA location lain, termasuk regex
    # aset statis dan SPA fallback — itulah yang membuat URL bersih tanpa akhiran
    # `.html` bekerja. Tautan silang di dalam naskah (`href="hapus-akun"`) juga
    # mengandalkan bentuk tanpa akhiran ini, jadi blok ini dan `routeHref()` di
    # `tool/policy_html.dart` satu paket — menghapus salah satunya mematikan yang
    # lain.
    #
    # Catatan riwayat: blok serupa pernah ada, lalu dihapus 27 Juli 2026 saat
    # berkas HTML-nya ikut dibuang, dengan peringatan "jangan ditambahkan lagi"
    # karena waktu itu akan 404. Berkasnya kini ada kembali di `web/`, jadi
    # peringatan itu tidak berlaku lagi.
    #
    # `expires`, bukan `add_header Cache-Control`: satu saja add_header di level
    # location akan membatalkan seluruh add_header level server di bawah (header
    # pengerasan X-Content-Type-Options dkk.) untuk respons ini.
    #
    # `charset utf-8` menambahkan `;charset=utf-8` ke Content-Type. Naskahnya memuat
    # karakter non-ASCII (em dash, tanda panah "Profil → Privasi"), dan tanpa charset
    # di header sebagian pembaca menebak dari <meta> atau — kalau tidak memproses
    # HTML sama sekali — menebak salah. Versi lama yang disajikan backend juga
    # mengirimkannya eksplisit; ini mempertahankan perilaku itu.
    location = /kebijakan-privasi {
        try_files /kebijakan-privasi.html =404;
        charset utf-8;
        expires 1h;
    }
    location = /hapus-akun {
        try_files /hapus-akun.html =404;
        charset utf-8;
        expires 1h;
    }

    # SPA fallback: every other path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
